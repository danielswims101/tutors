# Alternative host: Fly.io.  fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly deploy
app = "ascend-prep"
primary_region = "iad"
[build]
[env]
  DATA_DIR = "/data"
  PORT = "3000"
[mounts]
  source = "data"
  destination = "/data"
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"
